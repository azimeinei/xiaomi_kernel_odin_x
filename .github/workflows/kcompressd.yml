name: Build Kernel kcompressd
on:
  workflow_dispatch:
    inputs:
      target_defconfig:
        description: Defconfig
        required: true
        default: odin_defconfig
      target_arch:
        description: Arch
        required: true
        default: arm64

env:
  CLANG_VER: "r416183b"
  BUILD_OUTPUT: out

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt update -y
          sudo apt install -y build-essential libssl-dev libelf-dev bison flex bc git zip unzip wget curl python3 cpio rsync lz4 xz-utils

      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Cache toolchain
        id: cache_tc
        uses: actions/cache@v3
        with:
          path: prebuilts
          key: tc-clang-${{ env.CLANG_VER }}-gcc49-v3

      - name: Download clang (LineageOS mirror) + gcc
        if: steps.cache_tc.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p prebuilts/clang/host/linux-x86 prebuilts/gcc/linux-x86/aarch64
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_clang_host_linux-x86_clang-${{ env.CLANG_VER }} prebuilts/clang/host/linux-x86/clang-${{ env.CLANG_VER }}
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9

      - name: Build kernel
        run: |
          set -euo pipefail
          export PATH="$PWD/prebuilts/clang/host/linux-x86/clang-${{ env.CLANG_VER }}/bin:$PWD/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-
          make O=$BUILD_OUTPUT ${{ github.event.inputs.target_defconfig }}
          make -j$(nproc) O=$BUILD_OUTPUT \
            ARCH=arm64 \
            CC=clang CXX=clang++ LD=ld.lld \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            Image.gz

      - name: Upload Image.gz
        uses: actions/upload-artifact@v4
        with:
          name: kernel-image-sukuu
          path: |
            ${{ env.BUILD_OUTPUT }}/arch/arm64/boot/Image.gz
            ${{ env.BUILD_OUTPUT }}/.config