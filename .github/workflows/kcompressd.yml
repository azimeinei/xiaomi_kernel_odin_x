name: Build Kernel kcompressd
on:
  push:
    branches:
      - sukuU
    paths:
      - 'include/uapi/linux/capability.h'
      - 'security/selinux/include/classmap.h'
      - 'drivers/Makefile'
      - '.github/workflows/kcompressd.yml'
  workflow_dispatch:
    inputs:
      target_defconfig:
        description: Defconfig
        required: true
        default: odin_defconfig
      target_arch:
        description: Arch
        required: true
        default: arm64

env:
  BUILD_OUTPUT: out

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt update -y
          sudo apt install -y build-essential libssl-dev libelf-dev bison flex bc git zip unzip wget curl python3 cpio rsync lz4 xz-utils gcc-aarch64-linux-gnu

      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Cache toolchain
        id: cache_tc
        uses: actions/cache@v3
        with:
          path: prebuilts
          key: tc-proton-20240107-v1

      - name: Download proton-clang
        if: steps.cache_tc.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p prebuilts
          cd prebuilts
          wget -q "https://github.com/kdrag0n/proton-clang/archive/refs/heads/master.tar.gz" -O proton.tar.gz
          mkdir proton && tar -xf proton.tar.gz -C proton --strip-components=1 && rm proton.tar.gz

      - name: Build kernel
        run: |
          set -euo pipefail
          export PATH="$PWD/prebuilts/proton/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          {
            make O=$BUILD_OUTPUT ${{ github.event.inputs.target_defconfig || 'odin_defconfig' }}
            make -j$(nproc) O=$BUILD_OUTPUT \
              ARCH=arm64 \
              CC=clang \
              CLANG_TRIPLE=aarch64-linux-gnu- \
              Image.gz
          } 2>&1 | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build-log
          path: build.log
          if-no-files-found: error

      - name: Upload Image.gz
        uses: actions/upload-artifact@v4
        with:
          name: kernel-image-sukuu
          path: |
            ${{ env.BUILD_OUTPUT }}/arch/arm64/boot/Image.gz
            ${{ env.BUILD_OUTPUT }}/.config
