name: Build Kernel kcompressd
on:
  workflow_dispatch:
    inputs:
      target_defconfig:
        description: Defconfig
        required: true
        default: odin_defconfig
      target_arch:
        description: Arch
        required: true
        default: arm64

env:
  BUILD_OUTPUT: out

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt update -y
          sudo apt install -y build-essential libssl-dev libelf-dev bison flex bc git zip unzip wget curl python3 cpio rsync lz4 ccache device-tree-compiler clang lld gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Build kernel
        run: |
          set -euo pipefail
          clang --version
          aarch64-linux-gnu-gcc --version | head -1
          df -h /
          ls -ld scripts
          ls -l arch/arm64/configs/odin_defconfig
          make O=$BUILD_OUTPUT ARCH=arm64 ${{ github.event.inputs.target_defconfig }}
          make -j$(nproc) O=$BUILD_OUTPUT \
            ARCH=arm64 \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            Image.gz

      - name: Collect build log on failure
        if: failure()
        run: |
          make -j2 O=$BUILD_OUTPUT ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- Image.gz V=1 > build-error.log 2>&1 || true
          tail -300 build-error.log

      - name: Upload output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build-output
          path: |
            out/arch/arm64/boot/Image.gz
            out/.config
            out/include/config/auto.conf
            build-error.log