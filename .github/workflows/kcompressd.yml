name: Build Kernel kcompressd
on:
  workflow_dispatch:
    inputs:
      target_defconfig:
        description: Defconfig
        required: true
        default: odin_defconfig
      target_arch:
        description: Arch
        required: true
        default: arm64

env:
  CLANG_VER: "r383902b1"
  KERNEL_ROOT: ${{ github.workspace }}
  BUILD_OUTPUT: out

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Maximize disk space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 20480
          swap-size-mb: 2048
          remove-dotnet: true
          remove-android: true
          remove-haskell: true

      - name: Install dependencies
        run: |
          sudo apt update -y
          sudo apt install -y build-essential libssl-dev libelf-dev bison flex bc git zip unzip wget curl python3 cpio rsync lz4 ccache
          sudo apt clean
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Cache toolchain
        id: cache_tc
        uses: actions/cache@v3
        with:
          path: toolchain
          key: tc-clang-r383902b1-gcc49

      - name: Download toolchain
        if: steps.cache_tc.outputs.cache-hit != 'true'
        run: |
          mkdir -p toolchain
          cd toolchain
          wget -q "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main-kernel-build-2021/clang-r383902b1.tar.gz" -O clang.tar.gz
          mkdir clang && tar -xf clang.tar.gz -C clang && rm clang.tar.gz

          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 gcc64
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 gcc32

      - name: Build kernel
        run: |
          export PATH="$PWD/toolchain/clang/bin:$PWD/toolchain/gcc64/bin:$PWD/toolchain/gcc32/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-

          make O=$BUILD_OUTPUT ${{ github.event.inputs.target_defconfig }}
          make -j$(nproc) O=$BUILD_OUTPUT \
            ARCH=arm64 \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            Image.gz

      - name: Upload Image.gz
        uses: actions/upload-artifact@v4
        with:
          name: kernel-image
          path: |
            ${{ env.BUILD_OUTPUT }}/arch/arm64/boot/Image.gz
            ${{ env.BUILD_OUTPUT }}/.config
